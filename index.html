<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="main.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <div class="container flex">
    <main class="main">
        <article class="profile">
            <img src="./assets/images/avatar-jessica.jpeg" class="profile__img" alt="profile.img">
            <h1 class="profile__name">jessica randall</h1>
            <h2 class="profile__address">london,united kingdom</h2>
            <p class="profile__job">"Front-end developer and avid reader."</p>
        </article>
        <article class="social-links">
          <a href="#" class="link">GitHub</a>
          <a href="#" class="link">frontend Mentor</a>
          <a href="#" class="link">linkedin</a>
          <a href="#" class="link">twitter</a>
          <a href="#" class="link">instagram</a>
        </article>
    </main>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
